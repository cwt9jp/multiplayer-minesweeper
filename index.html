            * {
                font-family: "Roboto", "sans-serif";
            }

            .hidden {
                display: none !important;
            }

            h2 {
                font-weight: 400;
                font-size: 20px;
                color: white;

                display: block;
                width: min-content;
            }

            #menu-wrapper {
                /* visibility: hidden; */
                position: absolute;
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                
                background-color: rgba(0,0,0,0.7);

                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 15px;

                & > * {
                    width: min(500px, max(30%, 300px));
                    border-radius: 8px;
                }

                transition:
                    opacity 0.1s ease-in-out,
                    visibility 0.1s ease-in-out;

                &.menu-hidden {
                    opacity: 0;
                    visibility: hidden;
                }
            }

            .button-wrapper {
                display: flex;
                gap: 15px;

                & > * {
                    flex: 1;
                }
            }

            #players-button-wrapper {
                & > :first-child {
                    flex: unset;
                }
            }

            #join-button-wrapper {
                & > :last-child {
                    flex: 0.5;
                }
            }

            .menu-button {
                background-color: #4a752c;
                height: 64px;
                padding-inline: 10px;
                border: none;

                cursor: pointer;

                display: flex;
                align-items: center;
                justify-content: center;
                gap: 16px;

                border-radius: 8px;

                &:disabled {
                    background-color: #3a5b22;
                }

                &.actually-disabled {
                    background-color: #5a5a5a;
                    cursor: not-allowed;
                }

                transition: background-color ease-in-out 0.07s;
            }

            .button-img {
                height: 30px;
            }

            input[type="number"] {
                width: min(45px, 30%);
                height: min(40px, 80%);
                padding: 0 5px;

                border: none;
                border-radius: 3px;
                background-color: rgba(0,0,0,0.15);

                color: white;
                text-align: center;
                font-size: 20px;
            }

            /* Get rid of spinbox */
            input::-webkit-outer-spin-button,
            input::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }

            /* Firefox */
            input[type=number] {
                -moz-appearance: textfield;
                appearance: textfield;
            }

            input[type=text] {
                padding: 10px 15px;
                min-width: 80px;

                border: none;
                border-radius: 8px;
                background-color: #4a752c;

                color: white;
                font-size: 20px;
            }

            ::placeholder {
                color: rgb(190, 190, 190);
            }

        <canvas id="game" width="1920" height="1080" style="height: 100vh"></canvas>
        <script type="module">
            // TODO: Consolidate all repeating code into functions

            import { Peer } from 'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/+esm'
            
            // UI
            const menuWrapper = document.getElementById("menu-wrapper");

            const singleplayerButton = document.getElementById("singleplayer-button");
            const joinButton = document.getElementById("join-button");
            const hostButton = document.getElementById("host-button");

            const endlessButton = document.getElementById("endless-button");
            const finiteButton = document.getElementById("finite-button");
            const tileWidthInput = document.getElementById("tile-width-input");
            const tileHeightInput = document.getElementById("tile-height-input");
            let sizeOptionsDisabled = false;

            const joinButtonWrapper = document.getElementById("join-button-wrapper");
            const lobbyIDInput = document.getElementById("lobby-id-input");
            let lobbyIDInputDebounceTimeoutID;
            const readyButton = document.getElementById("ready-button");

            const hostButtonWrapper = document.getElementById("host-button-wrapper");
            const lobbyIDDiv = document.getElementById("lobby-id-div");
            const readyPlayersDiv = document.getElementById("ready-players-div");
            const playButton = document.getElementById("play-button");


            function toggleButtonPlayers(button) {
                if (joinButton.disabled && button != joinButton) {
                    sizeOptionsDisabled = false;

                    endlessButton.disabled = false;
                    endlessButton.classList.remove("actually-disabled");
                    finiteButton.disabled = false;
                    finiteButton.classList.remove("actually-disabled");

                    hostButtonWrapper.classList.remove("hidden");
                    joinButtonWrapper.classList.add("hidden");

                    client = false;
                    ready = false;
                    if (serverConnection) serverConnection.close();

                } else if (hostButton.disabled && button != hostButton) {
                    lobbyIDDiv.classList.add("hidden");
                    readyPlayersDiv.classList.add("hidden");

                    playButton.style.flex = "";
                    playButton.disabled = false;
                    playButton.classList.remove("actually-disabled");
                    playButton.children[playButton.children.length - 1].classList.remove("hidden");

                    hosting = false;
                    clientConnections.forEach((conn) => conn.close());
                    clientConnections = [];
                }

                singleplayerButton.disabled = false;
                joinButton.disabled = false;
                hostButton.disabled = false;
                button.disabled = true;
            }

            function toggleButtonSize(button) {
                if (sizeOptionsDisabled) { return; }

                endlessButton.disabled = false;
                finiteButton.disabled = false;
                button.disabled = true;
            }

            singleplayerButton.addEventListener("click", () => toggleButtonPlayers(singleplayerButton));
            
            joinButton.addEventListener("click", () => {
                if (joinButton.classList.contains("actually-disabled")) { return; }

                toggleButtonPlayers(joinButton);

                endlessButton.disabled = true;
                endlessButton.classList.add("actually-disabled");
                finiteButton.disabled = true;
                finiteButton.classList.add("actually-disabled");

                hostButtonWrapper.classList.add("hidden");
                joinButtonWrapper.classList.remove("hidden");
                
                sizeOptionsDisabled = true;
                client = true;
            });

            hostButton.addEventListener("click", () => {
                if (hostButton.classList.contains("actually-disabled")) { return; }

                toggleButtonPlayers(hostButton);

                lobbyIDDiv.classList.remove("hidden");
                readyPlayersDiv.classList.remove("hidden");

                playButton.style.flex = "unset";
                playButton.disabled = false;
                playButton.classList.add("actually-disabled");
                playButton.children[playButton.children.length - 1].classList.add("hidden");

                hosting = true;
            });

            endlessButton.addEventListener("click", () => toggleButtonSize(endlessButton));
            finiteButton.addEventListener("click", () => toggleButtonSize(finiteButton));

            lobbyIDInput.addEventListener("input", () => {
                clearTimeout(lobbyIDInputDebounceTimeoutID);

                lobbyIDInputDebounceTimeoutID = setTimeout(() => {
                    if (serverConnection) {
                        if (lobbyIDInput.value == serverConnection.peer) return;
                        else {
                            serverConnection.close();
                            readyButton.disabled = true;
                            readyButton.classList.add("actually-disabled");
                        }
                    }

                    serverConnection = peer.connect(lobbyIDInput.value);

                    serverConnection.on("open", () => {
                        readyButton.disabled = false;
                        readyButton.classList.remove("actually-disabled");
                    });
                    
                    serverConnection.on("close", () => {
                        readyButton.disabled = true;
                        readyButton.classList.add("actually-disabled");
                        serverConnection = undefined;
                    });
                    serverConnection.on('data', processServerData);
                }, 1000);
            });

            readyButton.addEventListener("click", () => {
                ready = !ready;

                if (serverConnection) {
                    serverConnection.send({
                        type: "ready",
                        ready: ready
                    })

                    if (ready) {
                        readyButton.children[readyButton.children.length - 1].textContent = "Unready";
                    } else {
                        readyButton.children[readyButton.children.length - 1].textContent = "Ready";
                    }
                }
            });

            playButton.addEventListener("click", () => {
                if (!hosting) {
                    menuWrapper.classList.add("menu-hidden");
                } else {
                    if (readyPlayers == clientConnections.length && !gameStarted) {
                        gameStarted = true;

                        clientConnections.forEach((conn, index) => {
                            clientConnectionIDs.push(conn.peer);
                            peerIDsToIndexDict[conn.peer] = index + 1;

                            const clientFlagData = newHueShiftedFlag(conn.peer);
                            flagSpriteSheets.push(clientFlagData[0]);
                            hoveredTileColors.push(clientFlagData[1]);
                            hoveredTiles.push({
                                i: null,
                                j: null
                            });
                        });

                        menuWrapper.classList.add("menu-hidden");
                        clientConnections.forEach(conn => {
                            conn.send({ type: "startGame", peerIDs: clientConnectionIDs });
                        });

                    }
                    
                }
            });

            // Multiplayer
            let hosting = false;
            let clientConnections = [];
            let clientConnectionIDs = [];
            let readyPlayers = 0;

            let client = false;
            let ready = false;
            let serverConnection;

            let peerIDsToIndexDict = {}; // This will contain its own peer id if client, else not

            let gameStarted = false;

            let peer;

            async function hasInternetConnection() {
                // Step 1: Check if the device is even connected to a local network
                if (!navigator.onLine) {
                    return false;
                }

                // Step 2: Verify actual internet access by fetching a small resource
                try {            
                    // Using a cache-busting timestamp to prevent false positives from local cache
                    
                    const response = await fetch("https://multiplayerminesweeper.metered.live/api/v1/turn/credentials?apiKey=3b6760f034e57278a79fe4068b14c065cc77", { 
                        method: "GET", 
                        cache: "no-store" 
                    });
                    
                    const iceServers = await response.json();

                    return iceServers;

                } catch (error) {
                    console.log(error);
                    // Fetch failed, meaning there is no actual internet access
                    return false;
                }
            }

            function processServerData(data) {
                console.log(data);

                switch (data.type) {
                    case "startGame":
                        if (gameStarted) break;

                        gameStarted = true;

                        menuWrapper.classList.add("menu-hidden");

                        peerIDsToIndexDict[peer.id] = 0;

                        const clientFlagData = newHueShiftedFlag(serverConnection.peer);
                        flagSpriteSheets.push(clientFlagData[0]);
                        hoveredTileColors.push(clientFlagData[1]);
                        hoveredTiles.push({
                            i: null,
                            j: null
                        });
                        peerIDsToIndexDict[serverConnection.peer] = 1;

                        data.peerIDs.forEach((peerID, index) => {
                            if (peerID == peer.id) return;

                            const clientFlagData = newHueShiftedFlag(peerID);
                            flagSpriteSheets.push(clientFlagData[0]);
                            hoveredTileColors.push(clientFlagData[1]);
                            hoveredTiles.push({
                                i: null,
                                j: null
                            });
                            peerIDsToIndexDict[peerID] = hoveredTileColors.length - 1;
                        });
                        break;

                    case "hoveredTileMoved":
                        hoveredTiles[peerIDsToIndexDict[data.peer]].i = data.i;
                        hoveredTiles[peerIDsToIndexDict[data.peer]].j = data.j;
                        break;

                    case "tileRevealed":
                        recursiveReveal(data.i, data.j);
                        break;

                    case "flagPlanted":
                        plantFlag(data.i, data.j, peerIDsToIndexDict[data.peer]);
                        break;

                    case "flagRemoved":
                        removeFlag(data.i, data.j);
                        break;

                    case "seed":
                        seed = data.seed;

                        let playUnplantAudio = false;

                        plantedFlags.forEach((map, flagI, _) => {
                            map.forEach((_, flagJ) => {
                                removeFlag(flagI, flagJ, true, false);
                                playUnplantAudio = true;
                            });
                        });
                        if (playUnplantAudio) playAudio(unplantFlagAudioBuffer);
                        break;
                }
            }

            hasInternetConnection().then(iceServers => {
                if (iceServers) {
                    const peerID = Math.floor(Math.random() * 899999 + 100000);
                    peer = new Peer(peerID, {
                        config: {
                            iceServers: iceServers
                        }
                    });
                    lobbyIDDiv.children[lobbyIDDiv.children.length - 1].textContent = peerID;

                    peer.on("open", () => {
                        joinButton.classList.remove("actually-disabled");
                        hostButton.classList.remove("actually-disabled");
                    });

                    peer.on("connection", (conn) => {
                        if (hosting) {
                            clientConnections.push(conn);
                            conn.ready = false;

                            readyPlayersDiv.children[readyPlayersDiv.children.length - 1].textContent = `${readyPlayers}/${clientConnections.length}`;

                            conn.on("close", () => {
                                if (conn.ready) readyPlayers--;
                                clientConnections = clientConnections.filter(c => c !== conn);

                                readyPlayersDiv.children[readyPlayersDiv.children.length - 1].textContent = `${readyPlayers}/${clientConnections.length}`;
                            })

                            conn.on("open", () => {
                                conn.on("data", (data) => {

                                            }));

                                                j: data.j
                                            }));

                                        case "removeFlag":

            const mineAudioBuffers = [mine1AudioBuffer, mine2AudioBuffer, mine3AudioBuffer, mine4AudioBuffer, mine5AudioBuffer];



            async function loadAudioDataUri(dataUri) {
                // 1. Fetch the data URI (fetch natively supports data URIs)
                const response = await fetch(dataUri);
                
                // 2. Convert the response into an ArrayBuffer
                const arrayBuffer = await response.arrayBuffer();
                
                // 3. Decode the audio data for the Web Audio API
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                return audioBuffer;
            }

            function playAudio(audioBuffer) {
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);
                source.start(0);
            }

            function sendRecursiveReveal(i, j) {
                serverConnection.send({
                    type: "revealTile",
                    i: i,
                    j: j
                });
            }

            function recursiveReveal(i, j, recursed = false) {
                if (checkIfTileRevealed(i, j) || checkIfFlagPlanted(i, j) !== false || checkIfMineRevealed(i, j)) { return }
                if (!recursed && hosting) {
                    clientConnections.forEach(conn => conn.send({
                        type: "tileRevealed",
                        i: i,
                        j: j
                    }));
                }

                revealTile(i, j);

                if (checkIfMineAt(i, j)) { return; }

                if (getRevealedTileAdjacentMines(i, j) == 0) {
                    for (let potentialI = i - 1; potentialI < i + 2; potentialI++) {
                        for (let potentialJ = j - 1; potentialJ < j + 2; potentialJ += 2) {
                            if (checkIfFlagPlanted(potentialI, potentialJ) !== false) {
                                removeFlag(potentialI, potentialJ);
                            }
                            recursiveReveal(potentialI, potentialJ, true);
                        }
                    }

                    recursiveReveal(i - 1, j, true);
                    recursiveReveal(i + 1, j, true);
                }

                if (!recursed) {
                    playAudio(digAudioBuffers[getRevealedTileAdjacentMines(i, j)]);
                }
            }

            // How to store a bunch of coordinates fast? We use Map with x as the index, that maps
            // to a Map containing all y coordinates, that maps to the amount of mines around. Three lookups in O(1) time and we're done!
            function revealTile(i, j) {
                if (!checkIfMineAt(i, j)) {
                    fallingTiles.push(new FallingTile(i, j, Math.random() * 200 - 100, Math.random() * -150));
                } else {
                    revealMine(i, j);
                    dead = frameTime;
                    pFrameTime = frameTime;
                    bombageddon = frameTime;
                    screenShaking = frameTime;
                    return;
                }

                if (!revealedTiles.has(i)) {
                    revealedTiles.set(i, new Map());
                }

                revealedTiles.get(i).set(j, countAdjacentMines(i, j));
            }

            function revealMine(i, j) {
                fallingTiles.push(new FallingTile(i, j, 0, -210));
                animatingMines.push(new AnimatingMine(i, j));
                playAudio(mineAudioBuffers[Math.floor(Math.random() * mineAudioBuffers.length)]);

                for (let _ = 0; _ < 10; _++) {
                    fallingConfetti.push(new Confetto(i, j, animatingMines[animatingMines.length - 1].mineColorIndex));
                }

                if (!revealedMines.has(i)) {
                    revealedMines.set(i, new Set());
                }

                revealedMines.get(i).add(j);
            }

            function sendPlantFlag(i, j) {
                serverConnection.send({
                    type: "plantFlag",
                    i: i,
                    j: j
                });
            }

            function plantFlag(i, j, index = 0, sendToClients = true) { // sendToClients there because sometimes server needs to send conn.id, which must be done in the other call
                if (checkIfTileRevealed(i, j)) return;

                if (hosting && sendToClients) {
                    clientConnections.forEach(c => c.send({
                        type: "flagPlanted",
                        peer: peer.id,
                        i: i,
                        j: j
                    }));
                }

                animatingFlags.push(new AnimatingFlag(i, j, index));
                playAudio(plantFlagAudioBuffer);

                if (!plantedFlags.has(i)) {
                    plantedFlags.set(i, new Map());
                }

                plantedFlags.get(i).set(j, index);
            }

            /**
             * @returns {boolean | number} The flag index of the flag planted, or false if no flag was there
             */
            function checkIfFlagPlanted(i, j) {
                if (plantedFlags.has(i) && plantedFlags.get(i).has(j)) return plantedFlags.get(i).get(j);
                else return false;             
            }

            function checkIfFlagAnimating(i, j) {
                for (let index = 0; index < animatingFlags.length; index++) {
                    if (animatingFlags[index].i == i && animatingFlags[index].j == j) {
                        return index;
                    }
                }
                return false;
            }

            function checkIfMineRevealed(i, j) {
                return revealedMines.has(i) && revealedMines.get(i).has(j);
            }

            function checkIfTileRevealed(i, j) {
                return revealedTiles.has(i) && revealedTiles.get(i).has(j);
            }

            function sendRemoveFlag(i, j) {
                serverConnection.send({
                    type: 'removeFlag',
                    i: i,
                    j: j
                });
            }

            function removeFlag(i, j, silent = false, sendToPeers = true) {
                if (checkIfFlagPlanted(i, j) === false) return;

                if (hosting && sendToPeers) {
                    clientConnections.forEach(c => c.send({
                        type: "flagRemoved",
                        peer: peer.id,
                        i: i,
                        j: j
                    }));
                }

                if (!silent) playAudio(unplantFlagAudioBuffer);

                fallingFlags.push(new FallingFlag(i, j, plantedFlags.get(i).get(j)));
                plantedFlags.get(i).delete(j);
            }

            function addIncorrectFlag(i, j) {
                if (!incorrectFlags.has(i)) {
                    incorrectFlags.set(i, new Set());
                }

                incorrectFlags.get(i).add(j);
                console.log(incorrectFlags);
            }

            function checkIfIncorrectFlag(i, j) {
                return incorrectFlags.has(i) && incorrectFlags.get(i).has(j);
            }

            function getRevealedTileAdjacentMines(i, j) {
                return revealedTiles.get(i).get(j);
            }

            function getMineBombageddonTime(i, j) {
                return bombageddon + 20000 * hash(`${i}-${j}`);
            }

            function getMineColorIndex(i, j) {
                return Math.floor(hash(`${i},${j}`) * mineColors.length);
            }

            function checkIfMineAt(i, j) {
                return hash(`${i}+${j}`) < 0.2;
            }

            function countAdjacentMines(i, j) {
                let count = 0;
                for (let potentialI = i - 1; potentialI < i + 2; potentialI++) {
                    for (let potentialJ = j - 1; potentialJ < j + 2; potentialJ += 2) {
                        if (checkIfMineAt(potentialI, potentialJ)) {
                            count++;
                        }
                    }
                }

                if (checkIfMineAt(i - 1, j)) {
                    count++;
                }
                if (checkIfMineAt(i + 1, j)) {
                    count++;
                }

                return count;
            }

            function generateSeedFromClickAt(i, j) {
                for (let _ = 0; _ < 3000; _++) {
                    let fail = false;

                    seed = Math.random() * 4294967296 >>> 0;
                    for (let potentialI = i - 2; potentialI < i + 3; potentialI++) {
                        for (let potentialJ = j - 2; potentialJ < j + 3; potentialJ++) {
                            if (checkIfMineAt(potentialI, potentialJ)) {
                                fail = true;
                                break;
                            }
                        }
                        if (fail) {break;}
                    }
                    if (!fail) {break;}
                }

                let playUnplantAudio = false;

                plantedFlags.forEach((map, flagI, _) => {
                    map.forEach((_, flagJ) => {
                        removeFlag(flagI, flagJ, true, false);
                        playUnplantAudio = true;
                    });
                });
                if (playUnplantAudio) playAudio(unplantFlagAudioBuffer);
            }
            
            function hash(str) {
                let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
                for (let i = 0, ch; i < str.length; i++) {
                    ch = str.charCodeAt(i);
                    h1 = Math.imul(h1 ^ ch, 2654435761);
                    h2 = Math.imul(h2 ^ ch, 1597334677);
                }
                h1  = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
                h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
                h2  = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
                h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
                return (4294967296 * (2097151 & h2) + (h1 >>> 0)) / Math.pow(2, 53);
            };

            function getFullscreenDimensions() {
                const containerRatio = canvas.clientWidth / canvas.clientHeight;
                const intrinsicRatio = canvas.width / canvas.height;

                let renderedWidth, renderedHeight;
                let letterBoxHeight = 0;
                let pillarBoxWidth = 0;

                if (intrinsicRatio > containerRatio) {
                    // Content is wider than the container (Letter-boxed top & bottom)
                    renderedWidth = canvas.clientWidth;
                    renderedHeight = canvas.clientWidth / intrinsicRatio;
                    letterBoxHeight = (canvas.clientHeight - renderedHeight) / 2;
                } else {
                    // Content is taller than the container (Pillar-boxed left & right)
                    renderedHeight = canvas.clientHeight;
                    renderedWidth = canvas.clientHeight * intrinsicRatio;
                    pillarBoxWidth = (canvas.clientWidth - renderedWidth) / 2;
                }

                return { 
                    width: renderedWidth, 
                    height: renderedHeight,
                    letterBoxHeight: letterBoxHeight,
                    pillarBoxWidth: pillarBoxWidth
                };
            }

            function resizeCanvas() {
                // Set canvas size depending on size of map
                if (gameSize.tileWidth < 1.5 * window.innerWidth / 45) {
                    canvas.width = 45 * gameSize.tileWidth;
                } else {
                    canvas.width = 1.5 * window.innerWidth;
                }

                if (gameSize.tileHeight < 1.5 * window.innerHeight / 45) {
                    canvas.height = 45 * gameSize.tileHeight;
                } else {
                    canvas.height = 1.5 * window.innerHeight;
                }

                ctx.font = "bold 37px Roboto, Arial, sans-serif";
                ctx.textAlign = "center";
            }

            function drawRotatedRect(x, y, width, height, theta, color) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(theta);
                ctx.fillStyle = color;
                ctx.fillRect(-width / 2, -height / 2, width, height);
                ctx.restore();
            }

            function drawRotatedFlag(x, y, scale, theta, index = 0) {
                const side = scale * 45;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(theta);
                ctx.drawImage(flagSpriteSheets[index], 0, 729, 80, 81, -side / 2, -side / 2, side, side);
                ctx.restore();
            }

            function checkIfTileHovered(i, j) {
                if (dead) return false;

                for (let index = 0; index < hoveredTiles.length; index++) {
                    if (hoveredTiles[index].i == i && hoveredTiles[index].j == j) return index;
                }

                return false;
            }

            class FallingTile {
                constructor(i, j, dx, dy) {
                    this.x = i * 45 + 22;
                    this.y = j * 45 + 22;
                    this.color = ((i + j) % 2 == 0) ? "#a2d149" : "#aad751";
                    this.dx = dx;
                    this.dy = dy;
                    this.dTheta = Math.random() * Math.PI - Math.PI / 2;
                    this.timeCreated = frameTime;

                    this.dead = false;
                }

                render() {
                    if (frameTime > this.timeCreated + 800) {
                        this.dead = true;
                        return;
                    }

                    const percentTime = (frameTime - this.timeCreated) / 800;

                    drawRotatedRect(
                        this.x - cameraCenter.x + this.dx * percentTime,
                        this.y - cameraCenter.y + this.dy * percentTime + 100 * (percentTime * percentTime),
                        (1 - percentTime) * 45, (1 - percentTime) * 45, percentTime * this.dTheta, this.color);
                }
            }

            class AnimatingFlag {
                constructor(i, j, index = 0) {
                    this.i = i;
                    this.x = i * 45;
                    this.j = j;
                    this.y = j * 45;
                    this.timeCreated = frameTime;

                    this.flagSpriteSheet = flagSpriteSheets[index];

                    this.dead = false;
                }

                render() {
                    if (frameTime < this.timeCreated + 100) {
                        ctx.drawImage(this.flagSpriteSheet, 0, 81 * Math.floor((frameTime - this.timeCreated) * 9 / 100), 80, 81, this.x - cameraCenter.x, this.y - cameraCenter.y, 45, 45);
                    } else {
                        ctx.drawImage(this.flagSpriteSheet, 0, 729, 80, 81, this.x - cameraCenter.x, this.y - cameraCenter.y, 45, 45);
                        this.dead = true;
                    }
                }
            }

            class FallingFlag {
                constructor(i, j, index = 0) {
                    this.x = i * 45 + 22;
                    this.y = j * 45 + 22;
                    this.dx = Math.random() * 200 - 100;
                    this.dy = Math.random() * -300 - 100;
                    this.dTheta = Math.random() * 2 * Math.PI - Math.PI;
                    this.timeCreated = frameTime;
                    this.dead = false;

                    this.flagIndex = index;
                }

                render() {
                    if (frameTime < this.timeCreated + 1500) {
                        const percentTime = (frameTime - this.timeCreated) / 1500;
                        const side = percentTime < 0.5 ? 1 : 2 * (1 - percentTime);
                        drawRotatedFlag(
                        this.x - cameraCenter.x + this.dx * percentTime,
                        this.y - cameraCenter.y + this.dy * percentTime + 400 * (percentTime * percentTime),
                        side, percentTime * this.dTheta, this.flagIndex);
                    } else {
                        this.dead = true;
                    }
                }
            }

            class Confetto {
                constructor(i, j, mineColorIndex) {
                    this.x = i * 45 + 22;
                    this.y = j * 45 + 22;
                    this.wobble = Math.random() * 500 - 250;
                    this.speed = Math.random() * 0.15 + 0.3;
                    this.height = Math.random() * -100;
                    this.theta = Math.random() * Math.PI / 2 - Math.PI / 4;
                    this.timeCreated = frameTime;
                    this.aliveTime = Math.random() * 2500 + 2500;
                    this.timeRisingPercentage = Math.random() * 0.15 + 0.11;

                    this.dead = false;
                    
                    const factor = Math.random() * 3 / 10 + 0.7;
                    this.color = `rgb(${Math.round(mineColorRGB[mineColorIndex][0] * factor)}, ${Math.round(mineColorRGB[mineColorIndex][1] * factor)}, ${Math.round(mineColorRGB[mineColorIndex][2] * factor)})`;
                }

                render() {
                    // Two parts: Blast into air, and falling down.
                    const percentMaxTime = (frameTime - this.timeCreated) / 5000;
                    if (percentMaxTime < this.timeRisingPercentage) {
                        drawRotatedRect(
                            this.x - cameraCenter.x + 1.5 * this.wobble * percentMaxTime,
                            this.y - cameraCenter.y + this.height * (1 + Math.pow(percentMaxTime - this.timeRisingPercentage, 3) / Math.pow(this.timeRisingPercentage, 3)),
                            16, 10, this.theta * (this.timeRisingPercentage - percentMaxTime) / this.timeRisingPercentage, this.color);
                    } else {
                        const adjustedTime = percentMaxTime - this.timeRisingPercentage;
                        const aliveTimePercentage = (frameTime - this.timeCreated) / this.aliveTime;
                        const timePiOverSpeed = adjustedTime * Math.PI / this.speed;

                        drawRotatedRect(
                            this.x - cameraCenter.x + this.wobble * ( 1.5 * this.timeRisingPercentage + adjustedTime * Math.sin(timePiOverSpeed)),
                            this.y - cameraCenter.y + this.height - 5 * (1 - (Math.cos(2 * timePiOverSpeed) + 2 * timePiOverSpeed)),
                            (aliveTimePercentage < 0.8) ? 16 : 16 * (1 - (aliveTimePercentage - 0.8) / 0.2),
                            (aliveTimePercentage < 0.8) ? 10 : 10 * (1 - (aliveTimePercentage - 0.8) / 0.2),
                            (Math.sin(timePiOverSpeed) + timePiOverSpeed * Math.cos(timePiOverSpeed)) * this.wobble * 0.0005,
                            this.color);
                    }

                    if (frameTime > this.timeCreated + this.aliveTime) {
                        this.dead = true;
                    }
                }
            }

            class AnimatingMine {
                constructor(i, j) {
                    this.x = i * 45;
                    this.y = j * 45;
                    this.timeCreated = frameTime;
                    this.mineColorIndex = getMineColorIndex(i, j);
                    this.color = mineColors[this.mineColorIndex];
                    this.dead = false;
                }

                render() {
                    if (frameTime < this.timeCreated + 500) {
                        const percentTime = (frameTime - this.timeCreated) / 500;
                        this.color = `rgb(${Math.round(255 - (255 - mineColorRGB[this.mineColorIndex][0]) * percentTime)}, ${Math.round(255 - (255 - mineColorRGB[this.mineColorIndex][1]) * percentTime)}, ${Math.round(255 - (255 - mineColorRGB[this.mineColorIndex][2]) * percentTime)})`;
                        
                    } else {
                        this.color = mineColors[this.mineColorIndex];
                        this.dead = true;
                    }

                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x - cameraCenter.x, this.y - cameraCenter.y, 45, 45);

                    ctx.fillStyle = "rgb(0, 0, 0, 0.25)";
                    ctx.beginPath();
                    ctx.arc(this.x - cameraCenter.x + 22, this.y - cameraCenter.y + 22, 11, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }

            function updateMap(timestamp) {
                // "#aad751" light green
                // "#a2d149" darker green
                // "#87af3a" dark green
                // "#e5c29f" light beige
                // "#d7b899" dark beige

                frameTime = timestamp;

                if (screenShaking !== false) {
                    // For infinite screen shake
                    const dt = frameTime - screenShaking;
                    if (dt < 1000) {
                        cameraCenter.x += Math.round(2.5 * screenShakeSigns.x * Math.sin((Math.PI * dt) / 50 + Math.PI) * (1000 - dt) / 1000 + 0.06);
                        cameraCenter.y += Math.round(2.5 * screenShakeSigns.y * Math.sin((Math.PI * dt) / 40 + Math.PI) * (1000 - dt) / 1000 + 0.04);
                    } else {
                        screenShaking = false;
                    }
                }
                
                for (let i = Math.floor(cameraCenter.x / 45); i < Math.floor(cameraCenter.x / 45) + Math.ceil(canvas.width / 45) + 1; i++) {
                    for (let j = Math.floor(cameraCenter.y / 45); j < Math.floor(cameraCenter.y / 45) + Math.ceil(canvas.height / 45) + 1; j++) {
                        // if (checkIfMineAt(i, j)) {
                        //     ctx.fillStyle = "red";

                        //     ctx.fillRect(i * 45 - cameraCenter.x, j * 45 - cameraCenter.y, 45, 45);
                        // } else 
                        if (!checkIfTileRevealed(i, j)) {
                            const bombageddonMineTime = bombageddon && !bombageddonFinished && checkIfMineAt(i, j)
                                ? getMineBombageddonTime(i, j)
                                : null;

                            const flagPlanted = checkIfFlagPlanted(i, j) !== false;

                            if (checkIfMineRevealed(i, j) || (checkIfMineAt(i, j) && bombageddonFinished && !flagPlanted)) { // Render a normal mine tile if revealed, or if bombageddon has finished
                                ctx.fillStyle = mineColors[getMineColorIndex(i, j)];
                                ctx.fillRect(i * 45 - cameraCenter.x, j * 45 - cameraCenter.y, 45, 45);

                                ctx.fillStyle = "rgb(0, 0, 0, 0.25)";
                                ctx.beginPath();
                                ctx.arc(i * 45 - cameraCenter.x + 22, j * 45 - cameraCenter.y + 22, 11, 0, 2 * Math.PI);
                                ctx.fill();
                            } else if (bombageddonMineTime !== null && pFrameTime < bombageddonMineTime && bombageddonMineTime < frameTime && !flagPlanted) {
                                revealMine(i, j);
                            } else if (bombageddonMineTime !== null && pFrameTime > bombageddonMineTime && !flagPlanted) {
                                ctx.fillStyle = mineColors[getMineColorIndex(i, j)];
                                ctx.fillRect(i * 45 - cameraCenter.x, j * 45 - cameraCenter.y, 45, 45);

                                ctx.fillStyle = "rgb(0, 0, 0, 0.25)";
                                ctx.beginPath();
                                ctx.arc(i * 45 - cameraCenter.x + 22, j * 45 - cameraCenter.y + 22, 11, 0, 2 * Math.PI);
                                ctx.fill();

                                // Add mine to revealedMines without confetti
                                if (!revealedMines.has(i)) {
                                    revealedMines.set(i, new Set());
                                }

                                revealedMines.get(i).add(j);
                            } else {
                                if ((i + j) % 2 == 0) {
                                    ctx.fillStyle = "#a2d149";
                                } else {
                                    ctx.fillStyle = "#aad751";
                                }

                                ctx.fillRect(i * 45 - cameraCenter.x, j * 45 - cameraCenter.y, 45, 45);

                                if (checkIfFlagPlanted(i, j) !== false) {
                                    const hoveredTileHere = checkIfTileHovered(i, j);

                                    if (hoveredTileHere !== false) {
                                        ctx.fillStyle = hoveredTileColors[hoveredTileHere];
                                        ctx.fillRect(i * 45 - cameraCenter.x, j * 45 - cameraCenter.y, 45, 45);
                                    }

                                    if (checkIfFlagAnimating(i, j) === false) {
                                        ctx.drawImage(flagSpriteSheets[checkIfFlagPlanted(i, j)], 0, 729, 80, 81, i * 45 - cameraCenter.x, j * 45 - cameraCenter.y, 45, 45);
                                    } else {
                                        animatingFlags[checkIfFlagAnimating(i, j)].render();
                                    }
                                }

                                if (checkIfIncorrectFlag(i, j)) {
                                    ctx.drawImage(incorrectFlagImage, i * 45 - cameraCenter.x, j * 45 - cameraCenter.y, 45, 45);
                                }
                            }

                        } else {
                            // Tile has been revealed. If mine, reveal. Draw border, number if not mine

                            let topLeftOccupied = false;
                            let topRightOccupied = false;
                            let bottomLeftOccupied = false;
                            let bottomRightOccupied = false;
                            const adjacentMines = getRevealedTileAdjacentMines(i, j);

                            if ((i + j) % 2 == 0) {
                                ctx.fillStyle = "#d7b899";
                            } else {
                                ctx.fillStyle = "#e5c29f";
                            }
                            ctx.fillRect(i * 45 - cameraCenter.x, j * 45 - cameraCenter.y, 45, 45);
                            // Add hoveredTile outline before border, number
                            const hoveredTileHere = checkIfTileHovered(i, j);

                            if (hoveredTileHere !== false && adjacentMines != 0) {
                                ctx.fillStyle = hoveredTileColors[hoveredTileHere];
                                ctx.fillRect(i * 45 - cameraCenter.x, j * 45 - cameraCenter.y, 45, 45);
                            }

                            ctx.fillStyle = "#87af3a";
                            if (!checkIfTileRevealed(i, j + 1)) {
                                ctx.fillRect(i * 45 - cameraCenter.x, j * 45 - cameraCenter.y + 41, 45, 4);
                                bottomLeftOccupied = true;
                                bottomRightOccupied = true;
                            }
                            if (!checkIfTileRevealed(i, j - 1)) {
                                ctx.fillRect(i * 45 - cameraCenter.x, j * 45 - cameraCenter.y, 45, 4);
                                topLeftOccupied = true;
                                topRightOccupied = true;
                            }
                            if (!checkIfTileRevealed(i + 1, j)) {
                                ctx.fillRect(i * 45 - cameraCenter.x + 41, j * 45 - cameraCenter.y, 4, 45);
                                topRightOccupied = true;
                                bottomRightOccupied = true;
                            }
                            if (!checkIfTileRevealed(i - 1, j)) {
                                ctx.fillRect(i * 45 - cameraCenter.x, j * 45 - cameraCenter.y, 4, 45);
                                topLeftOccupied = true;
                                bottomLeftOccupied = true;
                            }

                            if (!topLeftOccupied && !checkIfTileRevealed(i - 1, j - 1)) {
                                
                                ctx.fillRect(i * 45 - cameraCenter.x, j * 45 - cameraCenter.y, 4, 4);
                            }
                            if (!topRightOccupied && !checkIfTileRevealed(i + 1, j - 1)) {
                                ctx.fillRect(i * 45 - cameraCenter.x + 41, j * 45 - cameraCenter.y, 4, 4);
                            }
                            if (!bottomLeftOccupied && !checkIfTileRevealed(i - 1, j + 1)) {
                                ctx.fillRect(i * 45 - cameraCenter.x, j * 45 - cameraCenter.y + 41, 4, 4);
                            }
                            if (!bottomRightOccupied && !checkIfTileRevealed(i + 1, j + 1)) {
                                ctx.fillRect(i * 45 - cameraCenter.x + 41, j * 45 - cameraCenter.y + 41, 4, 4);
                            }

                            // Now add text
                            if (adjacentMines != 0) {
                                ctx.fillStyle = mineNumberColors[adjacentMines];
                                ctx.fillText(adjacentMines, i * 45 - cameraCenter.x + 22, j * 45 - cameraCenter.y + 36);
                            }
                        }

                    }
                }
                
                if (!client && !hosting) {
                    if (hoveredTile.i != null && !checkIfTileRevealed(hoveredTile.i, hoveredTile.j) && !checkIfMineRevealed(hoveredTile.i, hoveredTile.j) && checkIfFlagPlanted(hoveredTile.i, hoveredTile.j) === false) {
                        ctx.fillStyle = "rgb(255, 255, 255, 0.25)";
                        ctx.fillRect(hoveredTile.i * 45 - cameraCenter.x, hoveredTile.j * 45 - cameraCenter.y, 45, 45);
                    }
                } else if (!dead) {
                    hoveredTiles.forEach((hTile, index) => {
                        if (hTile.i != null && !checkIfTileRevealed(hTile.i, hTile.j) && !checkIfMineRevealed(hTile.i, hTile.j) && checkIfFlagPlanted(hTile.i, hTile.j) === false) {
                            ctx.fillStyle = hoveredTileColors[index];
                            ctx.fillRect(hTile.i * 45 - cameraCenter.x, hTile.j * 45 - cameraCenter.y, 45, 45);
                        }
                    });
                }

                // Animations!
                animatingMines.forEach(mine => mine.render());
                animatingMines = animatingMines.filter(mine => !mine.dead);
                
                fallingConfetti.forEach(confetto => confetto.render());
                fallingConfetti = fallingConfetti.filter(confetto => !confetto.dead);

                fallingTiles.forEach(tile => tile.render());
                fallingTiles = fallingTiles.filter(tile => !tile.dead);

                fallingFlags.forEach(flag => flag.render());
                fallingFlags = fallingFlags.filter(flag => !flag.dead);

                animatingFlags = animatingFlags.filter(flag => !flag.dead);

                if (bombageddon && !bombageddonFinished) {
                    pFrameTime = frameTime;

                    if (frameTime > bombageddon + 21000) {
                        bombageddonFinished = true;
                        
                        // Reveal incorrect flags
                        plantedFlags.forEach((map, flagI, _) => {
                            map.forEach((_, flagJ) => {
                                if (!checkIfMineAt(flagI, flagJ)) {
                                    removeFlag(flagI, flagJ, true, false);
                                    addIncorrectFlag(flagI, flagJ);
                                    if (!bombageddonIncorrectFlagSoundPlayed) {
                                        playAudio(unplantFlagAudioBuffer);
                                        bombageddonIncorrectFlagSoundPlayed = true;
                                    }
                                }
                            });
                        });
                    }
                }

                requestAnimationFrame(updateMap);
            }
            
            // Events and event handling

            // Fullscreen
            document.addEventListener("keypress", (event) => {
                if (event.key === "f") {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    } else {
                        canvas.requestFullscreen();
                    }
                }
            })

            // Mouse events
            canvas.addEventListener("drag", ev => ev.preventDefault());

            // Prevent right-clicking bringing up context menu
            canvas.addEventListener("contextmenu", ev => ev.preventDefault());

            canvas.addEventListener("mousedown", (event) => {
                if (!dead) {
                    hoveredTile.i = Math.floor((event.offsetX * canvas.width / canvas.clientWidth + cameraCenter.x) / 45);
                    hoveredTile.j = Math.floor((event.offsetY * canvas.height / canvas.clientHeight + cameraCenter.y) / 45);
                }

                if (event.button == 0) {
                    mousePosition.x = event.offsetX;
                    mousePosition.y = event.offsetY;
                    previousCameraCenter.x = cameraCenter.x;
                    previousCameraCenter.y = cameraCenter.y;
                    if (gameSize.tileWidth > 42 || gameSize.tileHeight > 24) {
                        mouseDown = true;
                    }
                } else if (event.button == 2 && hoveredTile.i !== null) {
                    if (!checkIfTileRevealed(hoveredTile.i, hoveredTile.j) && !checkIfMineRevealed(hoveredTile.i, hoveredTile.j)) {
                        if (checkIfFlagPlanted(hoveredTile.i, hoveredTile.j) === false) {
                            if (!client) plantFlag(hoveredTile.i, hoveredTile.j);
                            else sendPlantFlag(hoveredTile.i, hoveredTile.j);
                        } else if (!checkIfFlagAnimating(hoveredTile.i, hoveredTile.j)) {
                            if (!client) removeFlag(hoveredTile.i, hoveredTile.j);
                            else sendRemoveFlag(hoveredTile.i, hoveredTile.j);
                        }
                    }
                }
            });

            canvas.addEventListener("touchstart", (event) => {
                event.preventDefault();

                const touch = event.touches[0] || event.changedTouches[0];
                const rect = event.target.getBoundingClientRect();
                const offsetX = touch.clientX - rect.left;
                const offsetY = touch.clientY - rect.top;

                if (!dead) {
                    hoveredTile.i = Math.floor((offsetX * canvas.width / canvas.clientWidth + cameraCenter.x) / 45);
                    hoveredTile.j = Math.floor((offsetY * canvas.height / canvas.clientHeight + cameraCenter.y) / 45);
                    
                    touchHeldTimeoutID = setTimeout(() => {
                        if (!(Math.abs(touchPosition.x - mousePosition.x) < 5 && Math.abs(touchPosition.y - mousePosition.y) < 5 && hoveredTile.i !== null)) return;
                        
                        if (!checkIfTileRevealed(hoveredTile.i, hoveredTile.j) && !checkIfMineRevealed(hoveredTile.i, hoveredTile.j)) {
                            if (checkIfFlagPlanted(hoveredTile.i, hoveredTile.j) === false) {
                                if (!client) plantFlag(hoveredTile.i, hoveredTile.j);
                                else sendPlantFlag(hoveredTile.i, hoveredTile.j);
                            } else if (!checkIfFlagAnimating(hoveredTile.i, hoveredTile.j)) {
                                if (!client) removeFlag(hoveredTile.i, hoveredTile.j);
                                else sendRemoveFlag(hoveredTile.i, hoveredTile.j);
                            }
                        }

                        touchHoldInputted = true;
                        touchHeldTimeoutID = null;
                    }, 250);

                    if (hosting) {
                        clientConnections.forEach(c => c.send({
                            type: "hoveredTileMoved",
                            i: hoveredTile.i,
                            j: hoveredTile.j,
                            peer: peer.id
                        }));
                    } else if (client) {
                        serverConnection.send({
                            type: "moveHoveredTile",
                            i: hoveredTile.i,
                            j: hoveredTile.j
                        });
                    }
                }

                mousePosition.x = offsetX;
                mousePosition.y = offsetY;

                touchPosition.x = offsetX;
                touchPosition.y = offsetY;

                previousCameraCenter.x = cameraCenter.x;
                previousCameraCenter.y = cameraCenter.y;

                if (gameSize.tileWidth > 42 || gameSize.tileHeight > 24) {
                    mouseDown = true;
                }
            });

            canvas.addEventListener("mousemove", (event) => {
                // Set hovered tile, pan
                if (!(document.fullscreenElement == canvas)) {
                    if (!dead) {
                        const potentialHoveredTileI = Math.floor((event.offsetX * canvas.width / canvas.clientWidth + cameraCenter.x) / 45);
                        const potentialHoveredTileJ = Math.floor((event.offsetY * canvas.height / canvas.clientHeight + cameraCenter.y) / 45);
                    
                        if (potentialHoveredTileI != hoveredTile.i || potentialHoveredTileJ != hoveredTile.j) {
                            hoveredTile.i = potentialHoveredTileI
                            hoveredTile.j = potentialHoveredTileJ;

                            if (hosting) {
                                clientConnections.forEach(c => c.send({
                                    type: "hoveredTileMoved",
                                    i: hoveredTile.i,
                                    j: hoveredTile.j,
                                    peer: peer.id
                                }));
                            } else if (client) {
                                serverConnection.send({
                                    type: "moveHoveredTile",
                                    i: hoveredTile.i,
                                    j: hoveredTile.j
                                });
                            }
                        }
                    }
                    
                    if (mouseDown) {
                        if (gameSize.tileWidth > 42) { cameraCenter.x = Math.round(previousCameraCenter.x - canvas.width * (event.offsetX - mousePosition.x) / canvas.clientWidth); }
                        if (gameSize.tileHeight > 24) { cameraCenter.y = Math.round(previousCameraCenter.y - canvas.height * (event.offsetY - mousePosition.y) / canvas.clientHeight); }
                    }
                } else {
                    const fullscreenDimensions = getFullscreenDimensions();
                    if (!dead) {
                        const potentialHoveredTileI = Math.floor(((event.offsetX - fullscreenDimensions.pillarBoxWidth) * canvas.width / fullscreenDimensions.width + cameraCenter.x) / 45);
                        const potentialHoveredTileJ = Math.floor(((event.offsetY - fullscreenDimensions.letterBoxHeight) * canvas.height / fullscreenDimensions.height + cameraCenter.y) / 45);
                        
                        if (potentialHoveredTileI != hoveredTile.i || potentialHoveredTileJ != hoveredTile.j) {
                            hoveredTile.i = potentialHoveredTileI
                            hoveredTile.j = potentialHoveredTileJ;

                            if (hosting) {
                                clientConnections.forEach(c => c.send({
                                    type: "hoveredTileMoved",
                                    i: hoveredTile.i,
                                    j: hoveredTile.j,
                                    peer: peer.id
                                }));
                            } else if (client) {
                                serverConnection.send({
                                    type: "moveHoveredTile",
                                    i: hoveredTile.i,
                                    j: hoveredTile.j
                                });
                            }
                        }
                    }

                    if (mouseDown) {
                        if (gameSize.tileWidth > 42) { cameraCenter.x = Math.round(previousCameraCenter.x - canvas.width * (event.offsetX - mousePosition.x) / fullscreenDimensions.width); }
                        if (gameSize.tileHeight > 24) { cameraCenter.y = Math.round(previousCameraCenter.y - canvas.height * (event.offsetY - mousePosition.y) / fullscreenDimensions.height); }
                    }
                }
            });

            canvas.addEventListener("touchmove", (event) => {
                event.preventDefault();

                const touch = event.touches[0] || event.changedTouches[0];
                const rect = event.target.getBoundingClientRect();
                const offsetX = touch.clientX - rect.left;
                const offsetY = touch.clientY - rect.top;

                touchPosition.x = offsetX;
                touchPosition.y = offsetY;

                // Set hovered tile, pan
                if (!(document.fullscreenElement == canvas)) {
                    if (!dead) {
                        const potentialHoveredTileI = Math.floor((offsetX * canvas.width / canvas.clientWidth + cameraCenter.x) / 45);
                        const potentialHoveredTileJ = Math.floor((offsetY * canvas.height / canvas.clientHeight + cameraCenter.y) / 45);
                    
                        if (potentialHoveredTileI != hoveredTile.i || potentialHoveredTileJ != hoveredTile.j) {
                            hoveredTile.i = potentialHoveredTileI
                            hoveredTile.j = potentialHoveredTileJ;

                            if (hosting) {
                                clientConnections.forEach(c => c.send({
                                    type: "hoveredTileMoved",
                                    i: hoveredTile.i,
                                    j: hoveredTile.j,
                                    peer: peer.id
                                }));
                            } else if (client) {
                                serverConnection.send({
                                    type: "moveHoveredTile",
                                    i: hoveredTile.i,
                                    j: hoveredTile.j
                                });
                            }
                        }
                    }
                    
                    if (mouseDown) {
                        if (gameSize.tileWidth > 42) { cameraCenter.x = Math.round(previousCameraCenter.x - canvas.width * (offsetX - mousePosition.x) / canvas.clientWidth); }
                        if (gameSize.tileHeight > 24) { cameraCenter.y = Math.round(previousCameraCenter.y - canvas.height * (offsetY - mousePosition.y) / canvas.clientHeight); }
                    }
                } else {
                    const fullscreenDimensions = getFullscreenDimensions();
                    if (!dead) {
                        const potentialHoveredTileI = Math.floor(((offsetX - fullscreenDimensions.pillarBoxWidth) * canvas.width / fullscreenDimensions.width + cameraCenter.x) / 45);
                        const potentialHoveredTileJ = Math.floor(((offsetY - fullscreenDimensions.letterBoxHeight) * canvas.height / fullscreenDimensions.height + cameraCenter.y) / 45);
                        
                        if (potentialHoveredTileI != hoveredTile.i || potentialHoveredTileJ != hoveredTile.j) {
                            hoveredTile.i = potentialHoveredTileI
                            hoveredTile.j = potentialHoveredTileJ;

                            if (hosting) {
                                clientConnections.forEach(c => c.send({
                                    type: "hoveredTileMoved",
                                    i: hoveredTile.i,
                                    j: hoveredTile.j,
                                    peer: peer.id
                                }));
                            } else if (client) {
                                serverConnection.send({
                                    type: "moveHoveredTile",
                                    i: hoveredTile.i,
                                    j: hoveredTile.j
                                });
                            }
                        }
                    }

                    if (mouseDown) {
                        if (gameSize.tileWidth > 42) { cameraCenter.x = Math.round(previousCameraCenter.x - canvas.width * (offsetX - mousePosition.x) / fullscreenDimensions.width); }
                        if (gameSize.tileHeight > 24) { cameraCenter.y = Math.round(previousCameraCenter.y - canvas.height * (offsetY - mousePosition.y) / fullscreenDimensions.height); }
                    }
                }
            });

            canvas.addEventListener("mouseup", (event) => {
                mouseDown = false;

                if (checkIfFlagPlanted(hoveredTile.i, hoveredTile.j) !== false) return;

                if (event.button == 0) {
                    if (Math.abs(event.offsetX - mousePosition.x) < 5 && Math.abs(event.offsetY - mousePosition.y) < 5 && hoveredTile.i !== null) {
                        // Click
                        if (seed == undefined) {
                            generateSeedFromClickAt(hoveredTile.i, hoveredTile.j);

                            if (client) {
                                serverConnection.send({
                                    type: "seed",
                                    seed: seed,
                                });
                                seed = undefined;
                            } else if (hosting) {
                                clientConnections.forEach(conn => conn.send({
                                    type: "seed",
                                    seed: seed,
                                }));
                            }

                            screenShaking = frameTime;
                            screenShakeSigns.x = Math.random() >= 0.5 ? 1 : -1;
                            screenShakeSigns.y = Math.random() >= 0.5 ? 1 : -1;
                        }

                        if (!client) recursiveReveal(hoveredTile.i, hoveredTile.j);
                        else sendRecursiveReveal(hoveredTile.i, hoveredTile.j);
                    }
                }
            });

            canvas.addEventListener("touchend", (event) => {
                event.preventDefault();

                mouseDown = false;

                if (touchHeldTimeoutID !== null) {
                    clearTimeout(touchHeldTimeoutID);
                    touchHeldTimeoutID = null;
                }

                if (touchHoldInputted) {
                    touchHoldInputted = false;
                    return;
                }

                if (checkIfFlagPlanted(hoveredTile.i, hoveredTile.j) !== false) return;

                const touch = event.touches[0] || event.changedTouches[0];
                const rect = event.target.getBoundingClientRect();
                const offsetX = touch.clientX - rect.left;
                const offsetY = touch.clientY - rect.top;

                if (Math.abs(offsetX - mousePosition.x) < 5 && Math.abs(offsetY - mousePosition.y) < 5 && hoveredTile.i !== null) {
                    // Click
                    if (seed == undefined) {
                        generateSeedFromClickAt(hoveredTile.i, hoveredTile.j);

                        if (client) {
                            serverConnection.send({
                                type: "seed",
                                seed: seed,
                            });
                        } else if (hosting) {
                            clientConnections.forEach(conn => conn.send({
                                type: "seed",
                                seed: seed,
                            }));
                        }

                        screenShaking = frameTime;
                        screenShakeSigns.x = Math.random() >= 0.5 ? 1 : -1;
                        screenShakeSigns.y = Math.random() >= 0.5 ? 1 : -1;
                    }

                    if (!client) recursiveReveal(hoveredTile.i, hoveredTile.j);
                    else sendRecursiveReveal(hoveredTile.i, hoveredTile.j);
                }
            });

            canvas.addEventListener("mouseleave", (ev) => hoveredTile.i = null);
            canvas.addEventListener("touchcancel", (ev) => {
                hoveredTile.i = null;
                touchHoldInputted = false;
 
                if (touchHeldTimeoutID !== null) {
                    clearTimeout(touchHeldTimeoutID);
                    touchHeldTimeoutID = null;
                }
            });

            window.addEventListener("resize", resizeCanvas);

            resizeCanvas();

            // Game loop
            requestAnimationFrame(updateMap);
        </script>
    </body>
